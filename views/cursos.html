<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cursos | Academia Auratec</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cursos.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>Academia Auratec</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cursos.html" class="activo">Cursos</a></li>
                <li><a href="profesores.html">Profesores</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <header class="header-cursos">
            <h1>Catálogo de Cursos</h1>
            <p>Encuentra el curso ideal para ti.</p>
            
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 20px;">
                <input type="text" id="buscador" class="buscador" style="margin-top: 0; width: 40%;" placeholder="Buscar por nombre o descripción...">
                
                <select id="filtro-categoria" class="buscador" style="margin-top: 0; width: 30%;">
                    <option value="Todos">Todas las Categorías</option>
                    <option value="Frontend">Frontend</option>
                    <option value="Backend">Backend</option>
                    <option value="Diseño">Diseño</option>
                    <option value="Herramientas">Herramientas</option>
                </select>
            </div>
        </header>

        <section class="categoria">
            <h2 id="titulo-categoria">Todos los Cursos</h2>
            <div id="contenedor-cursos" class="contenedor-cursos"></div>
        </section>
    </main>

    <footer>
        <div class="footer-contenido">
            <p>&copy; 2026 Academia Auratec. Todos los derechos reservados.</p>
            <p>Redes sociales: Facebook | LinkedIn</p>
        </div>
    </footer>

    <script src="js/cursos.js"></script>
